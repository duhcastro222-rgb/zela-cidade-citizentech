<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zela Cidade | Gestão</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="estilos.css" />
</head>
<body>
  <header class="topo">
    <a href="index.html" class="topo__marca">
      <div class="topo__anim" aria-hidden="true"><div id="anim-topo"></div></div>
      <div>
        <strong>Zela Cidade</strong>
        <span>Chamados anônimos de zeladoria urbana</span>
      </div>
    </a>
    <nav>
      <a href="index.html">Abrir chamado</a>
      <a href="acompanhar.html">Acompanhar</a>
      <a href="gestao.html" class="ativo">Gestão</a>
    </nav>
  </header>

  <main>
    <section class="cartao destaque">
      <div>
        <h1>Gestão de chamados</h1>
        <p class="suave">Acompanhe, priorize e resolva os chamados da cidade.</p>
        <div class="sessao">
          <span id="usuario-logado" class="suave"></span>
          <button type="button" id="btn-sair" class="secundario">Sair</button>
        </div>
      </div>
      <div id="anim-tela" class="destaque__anim" data-animacao="gestao" aria-hidden="true"></div>
    </section>

    <section class="cartao">
      <div class="titulo-linha">
        <h2>Visão geral</h2>
        <select id="filtro-status">
          <option value="">Todos os status</option>
          <option value="aberto">Aberto</option>
          <option value="em_andamento">Em andamento</option>
          <option value="resolvido">Resolvido</option>
        </select>
      </div>
      <div id="contadores" class="contadores"></div>
      <div id="mapa" class="mapa mapa--largo"></div>
    </section>

    <section class="cartao">
      <p id="msg-lista" class="mensagem"></p>
      <div class="tabela-rolagem">
        <table>
          <thead>
            <tr><th>Protocolo</th><th>Tipo</th><th>Local</th><th>Descrição</th><th>Prioridade</th><th>Status</th><th>Aberto em</th><th></th></tr>
          </thead>
          <tbody id="corpo-chamados"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"
          integrity="sha512-jEnuDt6jfecCjthQAJ+ed0MTVA++5ZKmlUcmDGBv2vUI/REn6FuIdixLNnQT+vKusE2hhTk2is3cFvv5wA+Sgg=="
          crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="comum.js"></script>
  <script src="gestao.js"></script>
</body>
</html>
